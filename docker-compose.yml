services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alim
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  adminer:
    image: adminer:latest
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend
    depends_on:
      - adminer

volumes:
  pgdata:

networks:
  frontend:
  backend:
